<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Main window mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens copied from DataWeave Studio src/index.css (Dusk / Paper) ===== */
:root {
  color-scheme: dark;
  --accent: oklch(72% 0.15 158);
  --accent-hover: oklch(78% 0.15 158);
  --accent-dim: oklch(72% 0.15 158 / 0.14);
  --accent-border: oklch(72% 0.15 158 / 0.32);
  --accent-ink: oklch(14% 0.004 80);

  --bg: oklch(14% 0.004 80);
  --surface: oklch(17% 0.004 80);
  --surface-2: oklch(20% 0.004 80);
  --surface-input: oklch(20% 0.004 80);
  --surface-3: oklch(24% 0.004 80);
  --rail: oklch(12% 0.004 80);

  --line: oklch(26% 0.004 80);
  --line-secondary: oklch(22% 0.004 80);
  --line-subtle: oklch(20% 0.004 80);

  --content: oklch(96% 0 0);
  --content-secondary: oklch(78% 0 0);
  --content-muted: oklch(60% 0 0);
  --content-faint: oklch(50% 0 0);
  --content-ghost: oklch(38% 0 0);

  --warn: oklch(80% 0.14 80);
  --err: oklch(68% 0.18 20);
  --ok: oklch(76% 0.15 155);
  --violet: oklch(72% 0.14 290);
  --cyan: oklch(75% 0.11 220);

  --scrollbar-thumb: oklch(30% 0.004 80);
  --scrollbar-thumb-hover: oklch(40% 0.004 80);
  --selection-bg: oklch(72% 0.15 158 / 0.35);
  --hover-overlay: oklch(100% 0 0 / 0.05);
  --shadow: 0 12px 40px rgba(0,0,0,0.45);

  /* Syntax palette from DataWeave Studio src/dataweaveTheme.ts */
  --syn-string: #88D4A4;
  --syn-number: #E2B36F;
  --syn-type: #DDD3BE;
  --syn-fn: #4EBEDE;

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --left-w: 272px;
  --right-w: 330px;
  --bottom-h: 168px;
}
.light {
  color-scheme: light;
  --accent: oklch(55% 0.15 158);
  --accent-hover: oklch(50% 0.15 158);
  --accent-dim: oklch(55% 0.15 158 / 0.10);
  --accent-border: oklch(55% 0.15 158 / 0.35);
  --accent-ink: oklch(100% 0 0);

  --bg: oklch(98% 0.003 80);
  --surface: oklch(100% 0 0);
  --surface-2: oklch(97% 0.003 80);
  --surface-input: oklch(100% 0 0);
  --surface-3: oklch(94% 0.004 80);
  --rail: oklch(96% 0.003 80);

  --line: oklch(90% 0.004 80);
  --line-secondary: oklch(94% 0.003 80);
  --line-subtle: oklch(96% 0.003 80);

  --content: oklch(20% 0 0);
  --content-secondary: oklch(35% 0 0);
  --content-muted: oklch(50% 0 0);
  --content-faint: oklch(65% 0 0);
  --content-ghost: oklch(78% 0 0);

  --warn: oklch(60% 0.15 80);
  --err: oklch(55% 0.18 20);
  --ok: oklch(52% 0.14 155);
  --violet: oklch(50% 0.15 290);
  --cyan: oklch(55% 0.12 220);

  --scrollbar-thumb: oklch(80% 0.004 80);
  --scrollbar-thumb-hover: oklch(70% 0.004 80);
  --selection-bg: oklch(55% 0.15 158 / 0.25);
  --hover-overlay: oklch(0% 0 0 / 0.04);
  --shadow: 0 12px 40px rgba(0,0,0,0.14);

  --syn-string: #1F6537;
  --syn-number: #8E6224;
  --syn-type: #3D3B36;
  --syn-fn: #0E6F87;
}

* { box-sizing: border-box; scrollbar-color: var(--scrollbar-thumb) var(--surface); }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--content);
  font-family: var(--font-sans); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: var(--surface); }
::selection { background: var(--selection-bg); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.app { height: 100vh; display: flex; flex-direction: column; user-select: none; }

/* ===== Header ===== */
header { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 0 0 12px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { width: 32px; display: flex; justify-content: center; }
.proj-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; font-weight: 600; font-size: 13px; }
.proj-btn:hover { background: var(--surface-2); }
.proj-btn .chev { color: var(--content-faint); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px;
  border: 1px solid var(--line); color: var(--content-muted); background: var(--surface-2); }
.palette-trigger { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; width: 340px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--content-faint); font-size: 12.5px; }
.palette-trigger:hover { color: var(--content-secondary); border-color: var(--content-ghost); }
.kbd { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--surface-3); color: var(--content-muted); }
.icon-btn { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--content-faint); }
.icon-btn:hover { background: var(--surface-2); color: var(--content); }
.icon-btn.on { color: var(--accent); }
.ghost-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--line); color: var(--content-muted); }
.ghost-btn:hover { color: var(--content); border-color: var(--content-ghost); }
.vsep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.winctl { display: flex; height: 44px; }
.winctl button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--content-muted); }
.winctl button:hover { background: var(--surface-2); color: var(--content); }
.winctl button.close:hover { background: #e81123; color: #fff; }

/* ===== Body ===== */
.body { flex: 1; min-height: 0; display: flex; }
.rail { width: 48px; flex-shrink: 0; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 10px 0; }
.rail-btn { position: relative; height: 36px; margin: 2px 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--content-faint); }
.rail-btn:hover { color: var(--content-secondary); }
.rail-btn.active { background: var(--surface-2); color: var(--content); }
.rail-btn.active::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); }
.rail-btn .badge { position: absolute; right: 2px; top: 3px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--err);
  color: #fff; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--rail); }

.side { width: var(--left-w); flex-shrink: 0; background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side-head { height: 36px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line-subtle); gap: 4px; }
.side-head .title { flex: 1; font-size: 12.5px; font-weight: 600; }
.mini-btn { width: 22px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--content-faint); }
.mini-btn:hover { background: var(--surface-2); color: var(--content); }
.filter { margin: 8px 8px 4px; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--content-faint); }
.filter:focus-within { border-color: var(--accent-border); }
.filter input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12px; color: var(--content); }
.tree { flex: 1; overflow: auto; padding: 2px 0 12px; }
.sec { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px 0 6px; margin-top: 6px; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--content-faint); cursor: pointer; }
.sec:hover { color: var(--content-secondary); }
.sec .count { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--content-ghost); font-size: 11px; }
.row { position: relative; display: flex; align-items: center; gap: 6px; height: 24px; padding-right: 8px; font-size: 12.5px; color: var(--content-secondary); cursor: pointer; white-space: nowrap; }
.row:hover { background: var(--hover-overlay); }
.row.sel { background: var(--accent-dim); color: var(--content); }
.row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.row .twist { width: 14px; flex-shrink: 0; display: inline-flex; justify-content: center; color: var(--content-ghost); }
.row .lbl { overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--content-faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
.row .tail { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.row .more { opacity: 0; }
.row:hover .more, .row.sel .more { opacity: 1; }
.res-lbl { font-family: var(--font-mono); font-size: 12px; color: var(--content); }
.m { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; width: 38px; height: 16px; border-radius: 3px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center; letter-spacing: 0.3px; }
.m-get { color: var(--cyan); background: color-mix(in oklch, var(--cyan) 14%, transparent); }
.m-post { color: var(--ok); background: color-mix(in oklch, var(--ok) 14%, transparent); }
.m-put { color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, transparent); }
.m-patch { color: var(--violet); background: color-mix(in oklch, var(--violet) 14%, transparent); }
.m-delete { color: var(--err); background: color-mix(in oklch, var(--err) 14%, transparent); }
.kind { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center; }
.k-type { color: var(--syn-number); background: color-mix(in oklch, var(--syn-number) 16%, transparent); }
.k-trait { color: var(--violet); background: color-mix(in oklch, var(--violet) 14%, transparent); }
.k-rt { color: var(--cyan); background: color-mix(in oklch, var(--cyan) 14%, transparent); }
.k-sec { color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, transparent); }
.k-lib { color: var(--accent); background: var(--accent-dim); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.cnt-err { font-size: 10.5px; font-weight: 600; color: var(--err); }
.cnt-warn { font-size: 10.5px; font-weight: 600; color: var(--warn); }
.xtag { font-size: 9.5px; font-weight: 600; padding: 0 5px; border-radius: 3px; color: var(--cyan); border: 1px solid color-mix(in oklch, var(--cyan) 35%, transparent); }

.split-x { width: 5px; margin: 0 -2px; flex-shrink: 0; cursor: col-resize; position: relative; z-index: 5; }
.split-x::after { content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 1px; background: var(--line); }
.split-x:hover::after { background: var(--accent); width: 2px; left: 1.5px; }
.split-y { height: 5px; margin: -2px 0; flex-shrink: 0; cursor: row-resize; position: relative; z-index: 5; }
.split-y::after { content: ""; position: absolute; top: 2px; left: 0; right: 0; height: 1px; background: var(--line); }
.split-y:hover::after { background: var(--accent); height: 2px; top: 1.5px; }

/* ===== Centre ===== */
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); }
.tabs { height: 36px; flex-shrink: 0; display: flex; align-items: stretch; background: var(--bg); border-bottom: 1px solid var(--line); min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; position: relative; display: flex; align-items: center; gap: 7px; padding: 0 10px 0 12px; font-size: 12.5px; color: var(--content-faint);
  border-right: 1px solid var(--line-secondary); cursor: pointer; max-width: 280px; }
.tab:hover { color: var(--content-secondary); }
.tab.active { background: var(--surface); color: var(--content); }
.tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--surface); }
.tab.active::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); }
.tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .x { width: 16px; height: 16px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; color: var(--content-faint); }
.tab .x:hover { background: var(--surface-3); color: var(--content); }
.tab .x .d { width: 7px; height: 7px; border-radius: 50%; background: var(--content-muted); }
.tab:hover .x.dirty .d { display: none; }
.tab .x.dirty svg { display: none; }
.tab:hover .x.dirty svg { display: block; }
.tab .x:not(.dirty) { visibility: hidden; }
.tab.active .x, .tab:hover .x { visibility: visible; }
.ficon { font-family: var(--font-mono); font-size: 9px; font-weight: 700; width: 14px; text-align: center; flex-shrink: 0; }
.f-raml { color: var(--violet); }
.f-json { color: var(--syn-number); }
.f-other { color: var(--content-faint); }
.tabs-end { margin-left: auto; position: sticky; right: 0; background: var(--bg); display: flex; align-items: center; gap: 2px; padding: 0 8px; }

.crumbs { height: 28px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 12px; font-size: 12px; color: var(--content-faint);
  border-bottom: 1px solid var(--line-subtle); overflow: hidden; white-space: nowrap; }
.crumb { padding: 1px 4px; border-radius: 4px; cursor: pointer; }
.crumb:hover { background: var(--surface-2); color: var(--content); }
.crumb.last { color: var(--content-secondary); }
.crumb.res { font-family: var(--font-mono); font-size: 11.5px; }
.crumbs .sepc { color: var(--content-ghost); }

.editor { flex: 1; min-height: 0; overflow: auto; position: relative; font-family: var(--editor-font, var(--font-mono)); font-size: var(--editor-size, 12.5px); cursor: text; user-select: text; }
.code { position: relative; padding: 6px 0 40vh; min-width: max-content; }
.ln { display: flex; height: 20px; line-height: 20px; white-space: pre; }
.ln.cur { background: var(--surface-2); }
.ln.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--accent-dim); } to { background: transparent; } }
.gut { position: sticky; left: 0; z-index: 2; width: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px;
  padding-right: 14px; color: var(--content-ghost); background: inherit; background-color: var(--surface); user-select: none; }
.ln.cur .gut { color: var(--content-muted); background-color: var(--surface-2); }
.gut .gd { width: 7px; height: 7px; border-radius: 50%; }
.txt { padding-left: 4px; position: relative; }
.caret { position: absolute; top: 2px; width: 2px; height: 16px; background: var(--accent); animation: blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.t-key { color: var(--violet); }
.t-res { color: var(--content); font-weight: 700; }
.t-m-get { color: var(--cyan); font-weight: 700; }
.t-m-post { color: var(--ok); font-weight: 700; }
.t-m-put { color: var(--warn); font-weight: 700; }
.t-m-patch { color: var(--violet); font-weight: 700; }
.t-m-delete { color: var(--err); font-weight: 700; }
.t-num { color: var(--syn-number); }
.t-media { color: var(--content-secondary); }
.t-str { color: var(--syn-string); }
.t-plain { color: var(--content); }
.t-type { color: var(--syn-type); }
.t-alias { color: var(--content-muted); }
.t-tag { color: var(--syn-fn); font-style: italic; }
.t-path { color: var(--syn-string); text-decoration: underline dotted color-mix(in oklch, var(--syn-string) 45%, transparent); text-underline-offset: 3px; }
.t-com { color: var(--content-faint); font-style: italic; }
.t-hdr { color: var(--violet); font-style: italic; }
.t-punc { color: var(--content-muted); }
.sq-error { text-decoration: underline wavy var(--err); text-decoration-skip-ink: none; text-underline-offset: 3px; }
.sq-warning { text-decoration: underline wavy var(--warn); text-decoration-skip-ink: none; text-underline-offset: 3px; }

/* autocomplete */
.ac { position: absolute; z-index: 20; display: flex; align-items: flex-start; gap: 4px; font-family: var(--font-sans); user-select: none; }
.ac-list { width: 330px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
.ac-head { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 10.5px; color: var(--content-faint); border-bottom: 1px solid var(--line-secondary); }
.ac-item { display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 8px; font-family: var(--font-mono); font-size: 12px; color: var(--content-secondary); cursor: pointer; }
.ac-item.on { background: color-mix(in oklch, var(--accent) 18%, transparent); color: var(--content); }
.ac-item .hl { color: var(--accent); font-weight: 700; }
.ac-item .det { margin-left: auto; font-family: var(--font-sans); font-size: 11px; color: var(--content-faint); }
.ac-foot { display: flex; gap: 10px; padding: 4px 8px; font-size: 10.5px; color: var(--content-ghost); border-top: 1px solid var(--line-secondary); }
.ac-doc { width: 270px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 12px; }
.ac-doc .nm { font-family: var(--font-mono); font-weight: 700; color: var(--syn-type); }
.ac-doc .props { margin-top: 8px; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; color: var(--content-secondary); }
.ac-doc .props .opt { color: var(--content-faint); }

/* problems */
.problems { height: var(--bottom-h); flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface); min-height: 0; }
.p-head { height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line-subtle); }
.p-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--content-secondary); display: flex; align-items: center; gap: 6px; }
.pill { font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--content-muted); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { height: 20px; padding: 0 8px; border-radius: 4px; font-size: 11px; color: var(--content-faint); display: inline-flex; align-items: center; gap: 5px; }
.seg button.on { background: var(--surface); color: var(--content); font-weight: 600; }
.p-meta { margin-left: auto; font-size: 11px; color: var(--content-faint); display: flex; align-items: center; gap: 8px; }
.p-list { flex: 1; overflow: auto; padding: 4px 0; }
.p-file { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px; font-size: 12px; color: var(--content-secondary); font-weight: 500; }
.p-file .path { color: var(--content-faint); font-weight: 400; font-size: 11.5px; }
.p-row { display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 2px 12px 2px 30px; font-size: 12.5px; cursor: pointer; }
.p-row:hover { background: var(--hover-overlay); }
.p-row .msg { color: var(--content); }
.p-row .hint { color: var(--content-faint); }
.p-row .loc { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--content-faint); white-space: nowrap; }
.p-row .src { font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--content-faint); white-space: nowrap; }
.fix-btn { height: 20px; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-dim); border: 1px solid var(--accent-border); white-space: nowrap; }
.fix-btn:hover { color: var(--accent-ink); background: var(--accent); }
.p-empty { padding: 18px 12px; color: var(--content-faint); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }

/* inspector */
.insp { width: var(--right-w); flex-shrink: 0; background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.insp-body { flex: 1; overflow: auto; padding: 14px 14px 24px; }
.i-title { display: flex; align-items: center; gap: 8px; }
.i-title .path { font-family: var(--font-mono); font-size: 13.5px; font-weight: 700; word-break: break-all; }
.i-sub { margin-top: 4px; font-size: 12.5px; color: var(--content-secondary); }
.i-loc { margin-top: 2px; font-family: var(--font-mono); font-size: 11px; color: var(--content-faint); cursor: pointer; }
.i-loc:hover { color: var(--accent); }
.i-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--line); color: var(--content-secondary); background: var(--surface-2); }
.btn:hover { color: var(--content); border-color: var(--content-ghost); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.i-sec { margin-top: 18px; }
.i-sec h4 { margin: 0 0 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--content-faint); display: flex; gap: 6px; align-items: center; }
.i-sec h4 .count { color: var(--content-ghost); letter-spacing: 0; }
.tchips { display: flex; flex-wrap: wrap; gap: 5px; }
.tchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 11.5px;
  color: var(--violet); background: color-mix(in oklch, var(--violet) 12%, transparent); border: 1px solid color-mix(in oklch, var(--violet) 25%, transparent); cursor: pointer; }
.tchip:hover { border-color: var(--violet); }
.note { margin-top: 6px; font-size: 11.5px; color: var(--content-faint); }
.note .mono { color: var(--content-muted); font-size: 11px; }
.kv { width: 100%; border-collapse: collapse; font-size: 12px; }
.kv td { padding: 4px 6px 4px 0; vertical-align: top; border-bottom: 1px solid var(--line-secondary); }
.kv tr:last-child td { border-bottom: 0; }
.kv .k { font-family: var(--font-mono); color: var(--content); white-space: nowrap; }
.kv .t { font-family: var(--font-mono); color: var(--syn-type); }
.kv .o { color: var(--content-faint); font-size: 11px; text-align: right; white-space: nowrap; }
.tref { font-family: var(--font-mono); cursor: pointer; color: var(--syn-type); }
.tref .al { color: var(--content-muted); }
.tref:hover { text-decoration: underline; }
.tref.bad { color: var(--err); text-decoration: underline wavy var(--err); }
.resp { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); }
.resp-top { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
.resp-top .tref { min-width: 0; overflow-wrap: anywhere; }
.code-badge { font-family: var(--font-mono); font-weight: 700; font-size: 11.5px; padding: 0 6px; border-radius: 3px; }
.c2 { color: var(--ok); background: color-mix(in oklch, var(--ok) 13%, transparent); }
.c4 { color: var(--warn); background: color-mix(in oklch, var(--warn) 13%, transparent); }
.c5 { color: var(--err); background: color-mix(in oklch, var(--err) 13%, transparent); }
.media { font-family: var(--font-mono); font-size: 11px; color: var(--content-faint); }
.ex { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--content-muted); cursor: pointer; }
.ex:hover .fn { text-decoration: underline; }
.ex .fn { font-family: var(--font-mono); font-size: 11px; color: var(--syn-string); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex.missing .fn { color: var(--err); }
.ex .st { margin-left: auto; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.usage { display: flex; align-items: center; gap: 7px; padding: 5px 6px; margin: 0 -6px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.usage:hover { background: var(--hover-overlay); }
.usage .p { font-family: var(--font-mono); font-size: 11.5px; color: var(--content); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.usage .w { margin-left: auto; color: var(--content-faint); font-size: 11px; white-space: nowrap; }
.i-empty { color: var(--content-faint); font-size: 12.5px; text-align: center; padding: 40px 18px; }

/* status bar */
.status { height: 26px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--rail); border-top: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 11px; color: var(--content-faint); }
.status button { font-family: var(--font-mono); font-size: 11px; color: inherit; display: inline-flex; align-items: center; gap: 5px; }
.status button:hover { color: var(--content-secondary); }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--warn); border-top-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }


/* modal dialogs (Duplicate As, settings) */
.modal-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
.light .modal-scrim { background: rgba(0,0,0,0.18); }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: calc(100vh - 48px); overflow: hidden; animation: min 0.14s ease-out; }
@keyframes min { from { transform: translateY(8px) scale(0.99); opacity: 0; } }
.modal-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.modal-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
.modal-head .sub { margin-top: 2px; font-size: 12px; color: var(--content-muted); }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }
.modal-foot .note { margin: 0; flex: 1; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.field { margin-bottom: 14px; }
.field > label, .field > .lab { display: block; margin-bottom: 5px; font-size: 11.5px; font-weight: 600; color: var(--content-secondary); }
.inp { width: 100%; height: 30px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-input); color: var(--content); outline: 0; font-size: 12.5px; }
.inp.mono { font-family: var(--font-mono); font-size: 12px; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.inp.bad { border-color: var(--err); box-shadow: 0 0 0 3px color-mix(in oklch, var(--err) 14%, transparent); }
.hint { margin-top: 5px; font-size: 11.5px; color: var(--content-faint); display: flex; gap: 5px; align-items: flex-start; }
.hint.err { color: var(--err); }
.check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; flex-shrink: 0; }
.toast .act { margin-left: 6px; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--accent); }
.toast .act:hover { background: var(--accent-dim); }
/* settings screen */
.set-nav { width: 180px; flex-shrink: 0; padding: 10px 8px; border-right: 1px solid var(--line); background: var(--bg); }
.set-nav button { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; color: var(--content-muted); text-align: left; }
.set-nav button:hover { color: var(--content); background: var(--hover-overlay); }
.set-nav button.on { background: var(--surface-2); color: var(--content); font-weight: 600; }
.set-body { flex: 1; overflow: auto; padding: 18px 22px 24px; }
.set-body h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.set-row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line-secondary); }
.set-row:last-child { border-bottom: 0; }
.set-row .txt2 { flex: 1; }
.set-row .t1 { font-size: 12.5px; color: var(--content); }
.set-row .t2 { font-size: 11.5px; color: var(--content-faint); margin-top: 2px; }
.sw-toggle { width: 32px; height: 18px; border-radius: 9px; background: var(--surface-3); border: 1px solid var(--line); position: relative; flex-shrink: 0; }
.sw-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--content-muted); transition: left 0.12s; }
.sw-toggle.on { background: var(--accent); border-color: var(--accent); }
.sw-toggle.on::after { left: 16px; background: var(--accent-ink); }
.theme-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.tcard { border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: left; }
.tcard.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
.tcard .pv { height: 62px; border-radius: 5px; overflow: hidden; display: flex; }
.tcard .nm { font-size: 12px; font-weight: 600; margin: 6px 2px 0; }
.sel { height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-input); color: var(--content); font-size: 12px; }


/* ===== Alignment with Design Center's layout ===== */
.brand { height: 28px; border-radius: 6px; }
.brand:hover { background: var(--surface-2); }
.save-state { font-size: 12px; color: var(--content-faint); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.save-state .push { height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11.5px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent-border); background: var(--accent-dim); }
.save-state .push:hover { background: var(--accent); color: var(--accent-ink); }
.branch-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 13px; color: var(--content-secondary); }
.branch-btn:hover { background: var(--surface-2); color: var(--content); }
.branch-btn b { color: var(--content); font-weight: 600; }
.ghost-btn.acc { color: var(--accent); border-color: var(--accent-border); }
.ghost-btn.acc:hover { background: var(--accent-dim); color: var(--accent); }
.rrail { border-right: 0; border-left: 1px solid var(--line); }
.rrail .rail-btn.active::before { left: auto; right: -8px; }
.ghost-tag { font-size: 10px; font-weight: 600; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--content-muted); }

/* the shelf: Design Center's click-to-insert suggestions, for the cursor's position */
.shelf { height: var(--shelf-h, 132px); flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg); border-top: 1px solid var(--line-subtle); min-height: 0; }
.shelf.collapsed { height: 26px; }
.shelf-head { height: 26px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 11px; color: var(--content-faint); }
.shelf-head .ctx { font-family: var(--font-mono); font-size: 11px; color: var(--content-muted); }
.shelf-cols { flex: 1; overflow: auto; display: flex; gap: 26px; padding: 2px 14px 10px; align-items: flex-start; }
.shelf-col { min-width: 96px; }
.shelf-col h6 { margin: 0 0 4px; font-size: 11.5px; font-weight: 600; color: var(--content-secondary); }
.shelf-item { display: block; text-align: left; height: 22px; padding: 0 8px; margin-bottom: 1px; font-family: var(--font-mono); font-size: 12px; color: var(--content-secondary);
  border-left: 2px solid var(--bar, var(--line)); border-radius: 0 4px 4px 0; white-space: nowrap; }
.shelf-item:hover { background: var(--surface-2); color: var(--content); }
.shelf-empty { padding: 6px 14px; font-size: 12px; color: var(--content-faint); }

/* Project errors, Design Center style: a bar that opens into Problems and Governance tabs */
.problems.collapsed { height: 28px !important; }
.p-bar { height: 28px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px; border-bottom: 1px solid var(--line-subtle); }
.problems.collapsed .p-bar { border-bottom: 0; }
.p-tab { height: 28px; padding: 0 10px; font-size: 12px; color: var(--content-faint); display: inline-flex; align-items: center; gap: 6px; border-bottom: 2px solid transparent; }
.p-tab.on { color: var(--content); border-bottom-color: var(--accent); font-weight: 600; }
.p-main { flex: 1; min-height: 0; display: flex; }
.problems.collapsed .p-main { display: none; }
.p-sev { width: 34px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; border-right: 1px solid var(--line-subtle); }
.p-sev button { width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; opacity: 0.35; }
.p-sev button.on { opacity: 1; background: var(--surface-2); }
.p-list { flex: 1; }

/* dependencies and exchange panels */
.grp { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; font-size: 12.5px; color: var(--content-secondary); cursor: pointer; border-bottom: 1px solid var(--line-subtle); }
.grp:hover { background: var(--hover-overlay); }
.grp .cnt { color: var(--content-faint); }
.dep { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px 8px 26px; border-bottom: 1px solid var(--line-subtle); }
.dep .nm { font-size: 12.5px; color: var(--content); }
.dep .sub { font-size: 11px; color: var(--content-faint); margin-top: 2px; }
.panel-pad { padding: 14px 14px 20px; font-size: 12.5px; color: var(--content-secondary); }
.panel-pad h5 { margin: 18px 0 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--content-faint); }
.lnk { color: var(--accent); cursor: pointer; }
.lnk:hover { text-decoration: underline; }
.chg { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
.chg .k { width: 14px; text-align: center; font-family: var(--font-mono); font-weight: 700; }
.ver { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--line-subtle); }
.badge-st { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 3px; }
.badge-st.stable { color: var(--ok); background: color-mix(in oklch, var(--ok) 13%, transparent); }
.badge-st.dev { color: var(--warn); background: color-mix(in oklch, var(--warn) 13%, transparent); }
.badge-st.dep { color: var(--err); background: color-mix(in oklch, var(--err) 13%, transparent); }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--content-secondary); padding: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line-secondary); vertical-align: middle; }
.tbl tr.depr .n { text-decoration: line-through; color: var(--content-faint); }
.avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--content-secondary); font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

/* documentation view */
.doc h2 { margin: 0; font-size: 15px; font-weight: 600; }
.doc .meta { font-size: 12px; color: var(--content-faint); margin-top: 4px; }
.doc .ep { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line-subtle); cursor: pointer; font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.doc .ep:hover { text-decoration: underline; }
.doc .mth { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; background: var(--bg); }
.doc .mth-top { display: flex; align-items: center; gap: 8px; }
.doc .row2 { display: flex; gap: 8px; font-size: 12px; padding: 3px 0; }
.doc .row2 .k { width: 74px; color: var(--content-faint); flex-shrink: 0; }

/* popovers, menus, palette, toast */
.pop { position: fixed; z-index: 50; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 200px; }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: 4px; font-size: 12.5px; color: var(--content-secondary); text-align: left; }
.mi:hover:not(:disabled) { background: var(--surface-3); color: var(--content); }
.mi:disabled { color: var(--content-ghost); cursor: default; }
.mi .sc { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--content-faint); }
.mi .ico { color: var(--content-faint); display: inline-flex; }
.msep { height: 1px; background: var(--line-secondary); margin: 4px 2px; }
.mlabel { padding: 6px 8px 2px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--content-faint); }
.settings { width: 280px; padding: 12px; }
.settings h5 { margin: 0 0 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--content-faint); }
.swatches { display: flex; gap: 8px; }
.sw { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }
.sw.on { outline: 2px solid var(--content); outline-offset: 2px; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; justify-content: center; height: 24px; }

.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.35); display: flex; justify-content: center; align-items: flex-start; padding-top: 90px; }
.light .scrim { background: rgba(0,0,0,0.12); }
.palette { width: 600px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.pal-in { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--content-faint); }
.pal-in input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--content); }
.pal-list { max-height: 420px; overflow: auto; padding: 4px 6px 8px; }
.pal-item { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 6px; font-size: 13px; color: var(--content-secondary); cursor: pointer; }
.pal-item.on { background: var(--accent-dim); color: var(--content); }
.pal-item .det { margin-left: auto; font-size: 11.5px; color: var(--content-faint); font-family: var(--font-mono); }
.pal-foot { display: flex; gap: 14px; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--content-faint); }

.toasts { position: fixed; right: 16px; bottom: 40px; z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line);
  box-shadow: var(--shadow); font-size: 12.5px; animation: tin 0.18s ease-out; max-width: 420px; }
.toast .ico { color: var(--accent); display: inline-flex; }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }
.hidden { display: none !important; }
</style>

<body>
<div class="app">
  <header>
    <button class="brand" id="homeBtn" title="All projects">
      <svg width="22" height="22" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="var(--accent)"/>
        <g fill="none" stroke="var(--accent-ink)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 7h4M7 12h3M9 7v10h3"/><circle cx="15.5" cy="12" r="1.7"/><circle cx="15.5" cy="17" r="1.7"/></g></svg>
    </button>
    <span class="save-state" id="saveState"></span>
    <div style="flex:1"></div>
    <button class="branch-btn" id="branchBtn" title="Branches"></button>
    <div style="flex:1"></div>
    <button class="icon-btn" id="palBtn" title="Search resources, types and files (Ctrl K)"><span data-ic="search" data-s="15"></span></button>
    <button class="ghost-btn" id="shareBtn"><span data-ic="share" data-s="14"></span>Share</button>
    <button class="ghost-btn acc" id="publishBtn"><span data-ic="exchange" data-s="14"></span>Publish</button>
    <button class="ghost-btn" id="projSettingsBtn" title="Project settings" style="padding:0 6px"><span data-ic="settings" data-s="15"></span><span data-ic="chevDown" data-s="12"></span></button>
    <div class="winctl">
      <button title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
      <button title="Maximize"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x=".5" y=".5" width="9" height="9" stroke="currentColor"/></svg></button>
      <button class="close" title="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="rail">
      <button class="rail-btn" data-rail="files" title="Files (Ctrl Shift E)"><span data-ic="files" data-s="18"></span></button>
      <button class="rail-btn" data-rail="api" title="API (Ctrl Shift A)"><span data-ic="api" data-s="18"></span></button>
      <button class="rail-btn" data-rail="deps" title="Dependencies"><span data-ic="deps" data-s="18"></span></button>

headers:

const OTHER_PATHS = [
  '.gitignore', 'exchange.json',
  'examples/list-orders-response.json', 'examples/create-order-request.json', 'examples/create-order-response.json',
  'examples/order-not-found.json', 'examples/update-order-request.json', 'examples/get-customer-response.json',
  'resource-types/collection.raml',
  'exchange_modules/acme-group/common-fragments/1.0.4/security/client-id.raml',
  'exchange_modules/acme-group/common-fragments/1.0.4/exchange.json',
];
const allPaths = () => [...new Set([...Object.keys(FILES), ...OTHER_PATHS])].sort();
const METHODS = ['get', 'post', 'put', 'patch', 'delete', 'head', 'options'];
const BUILTIN = ['string', 'number', 'integer', 'boolean', 'date-only', 'time-only', 'datetime', 'datetime-only', 'file', 'object', 'array', 'any', 'nil'];
const TRAIT_ADDS = { 'client-id-policy': 'headers client_id, client_secret', 'correlation-headers': 'header x-correlation-id', 'paged': 'query offset, limit' };
const fileText = p => FILES[p] ?? (p.endsWith('.json') ? '{\n  "note": "sample example"\n}' : '#%RAML 1.0 DataType\ntype: object');
const lines = p => fileText(p).split('\n');
const base = p => p.split('/').pop();
const lang = p => /\.(raml|ya?ml)$/.test(p) ? 'raml' : p.endsWith('.json') ? 'json' : 'other';

// ---------- Fast YAML-ish outline: the stand-in for the real `yaml` CST parse ----------
const KEY_RE = /^(\s*)(- )?("[^"]*"|[^\s#:][^:#]*?)(\s*:)(?:(\s+)(.*))?$/;
function entries(p) {
  const out = [];
  lines(p).forEach((l, i) => { const m = l.match(KEY_RE); if (m) out.push({ i, ind: m[1].length + (m[2] ? 2 : 0), key: m[3].trim(), val: (m[6] || '').trim() }); });
  return out;
}
function kids(E, k) {
  const out = []; let ci = null;
  for (let j = k + 1; j < E.length; j++) { if (E[j].ind <= E[k].ind) break; if (ci === null) ci = E[j].ind; if (E[j].ind === ci) out.push(j); }
  return out;
}
const kid = (E, k, key) => kids(E, k).find(j => E[j].key === key);
function keyPath(p, line) {
  if (lang(p) !== 'raml') return [];
  const L = lines(p), E = entries(p), at = new Map(E.map(e => [e.i, e]));
  const out = []; let cur = Infinity;
  for (let i = line; i >= 0; i--) {
    const e = at.get(i); if (!e) continue;
    if (i === line || e.ind < cur) { out.unshift(e); cur = e.ind; if (cur === 0) break; }
  }
  return out;
}

// ---------- Model built from the text (what amf-server's outline gives in the real app) ----------
let MODEL;
function buildModel() {
  const E = entries(MAIN);
  const resources = [];
  const walk = (k, parent) => {
    const node = { kind: 'res', id: 'res:' + parent + E[k].key, key: E[k].key, path: parent + E[k].key, file: MAIN, line: E[k].i, k, children: [], methods: [] };
    kids(E, k).forEach(j => {
      if (E[j].key.startsWith('/')) node.children.push(walk(j, node.path));
      else if (METHODS.includes(E[j].key)) {
        const dn = kid(E, j, 'displayName');
        node.methods.push({ kind: 'method', id: 'm:' + E[j].key + ':' + node.path, m: E[j].key, path: node.path, file: MAIN, line: E[j].i, k: j, name: dn != null ? E[dn].val : '', parent: node });
      }
    });
    return node;
  };
  E.forEach((e, k) => { if (e.ind === 0 && e.key.startsWith('/')) resources.push(walk(k, '')); });
  const decl = (key, kind) => { const t = E.findIndex(e => e.ind === 0 && e.key === key); return t < 0 ? [] : kids(E, t).map(j => ({ kind, id: kind + ':' + E[j].key, name: E[j].key, file: MAIN, line: E[j].i, target: E[j].val.replace('!include', '').trim().replace(/^\//, '') })); };
  const types = [];
  Object.entries(LIBS).forEach(([alias, f]) => {
    const LE = entries(f); const t = LE.findIndex(e => e.ind === 0 && e.key === 'types');
    kids(LE, t).forEach(j => {
      const tk = kid(LE, j, 'type'), pk = kid(LE, j, 'properties'), en = kid(LE, j, 'enum');
      const props = pk == null ? [] : kids(LE, pk).map(q => {
        const tt = LE[q].val || (kid(LE, q, 'type') != null ? LE[kid(LE, q, 'type')].val : 'object');
        return { name: LE[q].key.replace(/\?$/, ''), type: tt, opt: LE[q].key.endsWith('?') };
      });
      const shape = en != null ? 'string enum' : (tk != null ? LE[tk].val : 'object');
      types.push({ kind: 'type', id: 'type:' + alias + '.' + LE[j].key, alias, name: LE[j].key, q: alias + '.' + LE[j].key, file: f, line: LE[j].i, props, shape, enumVals: en != null ? LE[en].val : '' });
    });
  });
  const libs = Object.entries(LIBS).map(([alias, f]) => ({ kind: 'lib', id: 'lib:' + alias, name: alias, file: f, line: 0, exchange: f.startsWith('exchange_modules') }));
  MODEL = { resources, types, libs, traits: decl('traits', 'trait'), rtypes: decl('resourceTypes', 'rt'), schemes: decl('securitySchemes', 'sec') };
  MODEL.all = [];
  const flat = r => { MODEL.all.push(r); r.methods.forEach(m => MODEL.all.push(m)); r.children.forEach(flat); };
  resources.forEach(flat);
  MODEL.all.push(...types, ...MODEL.traits, ...MODEL.rtypes, ...MODEL.schemes, ...libs);
}
const byId = id => MODEL.all.find(n => n.id === id);

// Usages of a type: text match of alias.Name (main) and bare Name inside its own library, as in M0.2
function usagesOfType(t) {
  const out = [];
  lines(MAIN).forEach((l, i) => { if (new RegExp('\\b' + t.q.replace('.', '\\.') + '\\b').test(l)) out.push({ file: MAIN, line: i }); });
  lines(t.file).forEach((l, i) => { if (i !== t.line && new RegExp(':\\s+' + t.name + '(\\[\\])?\\s*$').test(l)) out.push({ file: t.file, line: i }); });
  return out;
}
function usageLabel(u) {
  const kp = keyPath(u.file, u.line);
  if (u.file !== MAIN) { const t = kp.find(e => e.ind === 2); const pr = kp[kp.length - 1]; return { m: null, p: (t ? t.key : '') + (pr && pr !== t ? '.' + pr.key.replace('?', '') : ''), w: base(u.file) }; }
  const mi = kp.findIndex(e => METHODS.includes(e.key));
  const path = kp.filter(e => e.key.startsWith('/')).map(e => e.key).join('');
  const rest = kp.slice(mi + 1).map(e => e.key).filter(k => !['body', 'application/json', 'type', 'responses'].includes(k));
  return { m: mi >= 0 ? kp[mi].key : null, p: path, w: rest.join(' ') || (mi >= 0 ? 'type' : '') };
}

// ---------- Problems (parse phase + validation phase, merged, as in M0.1) ----------
const PROBLEMS = [
  { id: 'p1', sev: 'error', src: 'parse', file: MAIN, find: 'ordersLib.OrderUpdte', msg: "Unknown type 'ordersLib.OrderUpdte'.", hint: 'Did you mean OrderUpdate?',

function blockEnd(L, E, k) {
  let end = L.length;
  for (let j = k + 1; j < E.length; j++) if (E[j].ind <= E[k].ind) { end = E[j].i; break; }
  while (end - 1 > E[k].i && !L[end - 1].trim()) end--;
  return end;
}

const SHELF = {
  root: [['Root', ['title', 'version', 'baseUri', 'mediaType', 'protocols', 'description']], ['Docs', ['documentation']], ['Declarations', ['uses', 'types', 'traits', 'resourceTypes', 'securitySchemes', 'annotationTypes']], ['Security', ['securedBy']]],

  method: [['Docs', ['description', 'displayName']], ['Types and Traits', ['is']], ['Security', ['securedBy']], ['Parameters', ['queryParameters', 'headers', 'queryString']], ['Body', ['body']], ['Responses', ['responses']], ['Protocols', ['protocols']]],
  responses: [['Success', ['200', '201', '202', '204']], ['Client errors', ['400', '401', '403', '404', '409', '422']], ['Server errors', ['500', '502', '503']]],
  response: [['Docs', ['description']], ['Body', ['body']], ['Headers', ['headers']]],
  body: [['Media types', ['application/json', 'application/xml', 'text/plain', 'multipart/form-data', 'application/x-www-form-urlencoded']]],
  media: [['Types and Examples', ['type', 'example', 'examples']]],
};
const BAR = { Methods: 'var(--content-muted)', Docs: 'var(--cyan)', 'Types and Traits': 'var(--violet)', Security: 'var(--err)', Parameters: 'var(--cyan)', Body: 'var(--ok)', Responses: 'var(--warn)',
  Success: 'var(--ok)', 'Client errors': 'var(--warn)', 'Server errors': 'var(--err)', 'Media types': 'var(--cyan)', 'Types and Examples': 'var(--violet)', Root: 'var(--content-muted)', Declarations: 'var(--violet)', Protocols: 'var(--content-muted)', Headers: 'var(--cyan)', Traits: 'var(--violet)' };
const SCALAR_KEYS = ['title', 'version', 'baseUri', 'mediaType', 'description', 'displayName', 'type', 'example', 'securedBy', 'protocols', 'is'];
function shelfContext() {
  const p = S.active; if (lang(p) !== 'raml' || p !== MAIN) return null;
  const L = lines(p), E = entries(p), line = S.cursor.line, t = L[line] || '';
  const here = E.findIndex(e => e.i === line);
  // a value position: type: and is: get lists of names, not keys
  if (here >= 0 && (E[here].key === 'type' || E[here].key === 'items')) return { kind: 'typeValue', line, E, L };
  if (here >= 0 && E[here].key === 'is') return { kind: 'isValue', line, E, L };
  let ck;
  if (here >= 0 && !E[here].val) ck = here; // a block key: suggest what goes inside it
  else {
    const ind = t.trim() ? t.match(/^\s*/)[0].length : S.cursor.col;
    ck = -1; for (let j = E.length - 1; j >= 0; j--) if (E[j].i < line && E[j].ind < ind) { ck = j; break; }
    if (here >= 0) { ck = -1; for (let j = here - 1; j >= 0; j--) if (E[j].ind < E[here].ind) { ck = j; break; } }
  }
  const key = ck >= 0 ? E[ck].key : null;
  const kind = ck < 0 ? 'root' : key.startsWith('/') ? 'resource' : METHODS.includes(key) ? 'method' : key === 'responses' ? 'responses'
    : /^\d{3}$/.test(key) ? 'response' : key === 'body' ? 'body' : key.includes('/') ? 'media' : null;
  const have = new Set((ck < 0 ? E.filter(e => e.ind === 0) : kids(E, ck).map(j => E[j])).map(e => e.key));
  return { kind, ck, E, L, line, have, label: ck < 0 ? 'top level' : keyPath(p, E[ck].i).map(e => e.key).join(' › ') };
}
function renderShelf() {
  const el = $('shelf');
  if (!S.shelf) { el.innerHTML = `<div class="shelf-head"><span>Shelf</span><span style="flex:1"></span><button class="mini-btn" id="shelfTgl" title="Show the shelf">${ic('chevUp', 13, 2)}</button></div>`; return; }
  const C = shelfContext();
  let cols = [];
  if (C?.kind === 'typeValue') {
    cols = Object.keys(LIBS).map(a => [a, MODEL.types.filter(t => t.alias === a).map(t => t.q)]);
    cols.push(['Built-in', ['string', 'number', 'integer', 'boolean', 'datetime', 'date-only', 'object', 'array']]);
  } else if (C?.kind === 'isValue') {
    const cur = (C.L[C.line].match(/\[(.*)\]/) || ['', ''])[1].split(',').map(s => s.trim());
    cols = [['Traits', MODEL.traits.map(t => t.name).filter(n => !cur.includes(n))]];
  } else if (C?.kind) {
    cols = SHELF[C.kind].map(([h, items]) => [h, items.filter(i => !C.have.has(i))]).filter(([, items]) => items.length);
  }
  const head = `<div class="shelf-head"><span>Shelf</span>${C ? `<span class="ctx">${esc(C.kind === 'typeValue' ? 'type' : C.kind === 'isValue' ? 'is' : C.label || '')}</span>` : ''}<span style="flex:1"></span><button class="mini-btn" id="shelfTgl" title="Hide the shelf">${ic('chevDown', 13, 2)}</button></div>`;
  const body = !C ? `<div class="shelf-empty">${lang(S.active) === 'json' ? 'No suggestions for example files.' : 'Suggestions show for the root file.'}</div>`
    : !cols.length ? `<div class="shelf-empty">Nothing to add here. Move the cursor to a resource, method, responses or body.</div>`
    : `<div class="shelf-cols">${cols.map(([h, items]) => `<div class="shelf-col" style="--bar:${BAR[h] || 'var(--syn-number)'}"><h6>${esc(h)}</h6>${items.map(i => `<button class="shelf-item" data-shelf="${esc(i)}">${esc(i)}</button>`).join('')}</div>`).join('')}</div>`;
  el.innerHTML = head + body;
}
function shelfInsert(item) {
  const C = shelfContext(); if (!C) return;
  const L = C.L; let line, col;
  if (C.kind === 'typeValue') { L[C.line] = L[C.line].replace(/:\s*\S*\s*$/, ': ' + item); line = C.line; col = L[line].length; }
  else if (C.kind === 'isValue') {
    L[C.line] = /\[\s*\]/.test(L[C.line]) || !/\[/.test(L[C.line]) ? L[C.line].replace(/:\s*.*$/, `: [ ${item} ]`) : L[C.line].replace(/\s*\]\s*$/, `, ${item} ]`);
    line = C.line; col = L[line].length;
  } else {
    const E = C.E;
    const childInd = C.ck < 0 ? 0 : (kids(E, C.ck)[0] != null ? E[kids(E, C.ck)[0]].ind : E[C.ck].ind + 2);
    const text = ' '.repeat(childInd) + item + ':' + (SCALAR_KEYS.includes(item) ? ' ' : '');
    if (!L[S.cursor.line].trim()) { L[S.cursor.line] = text; line = S.cursor.line; }
    else {
      let at;
      if (C.ck >= 0 && E[C.ck].i === S.cursor.line) at = blockEnd(L, E, C.ck);
      else { const kp = keyPath(MAIN, S.cursor.line); const mine = kp.find(e => e.ind === childInd); const k = mine ? E.findIndex(e => e.i === mine.i) : -1;
        at = k >= 0 ? blockEnd(L, E, k) : (C.ck >= 0 ? blockEnd(L, E, C.ck) : L.length); }
      L.splice(at, 0, text); line = at;
    }
    col = text.length;
  }
  FILES[MAIN] = L.join('\n'); S.dirty.add(MAIN);
  S.cursor = { line, col }; S.popup = null;
  buildModel(); syncSelFromCursor(); reparse(); scrollToLine(line, true);
}

      gi.forEach(it => { const i = flat.length; flat.push(it);
        const lead = it.m ? `<span class="m m-${it.m}">${it.m.toUpperCase()}</span>` : it.k ? `<span class="kind ${it.k === 'T' ? 'k-type' : 'k-trait'}">${it.k}</span>` : it.f ? `<span class="ficon f-${lang(it.f)}">${lang(it.f) === 'raml' ? 'R' : lang(it.f) === 'json' ? '{}' : '·'}</span>` : `<span style="color:var(--content-faint);display:inline-flex">${ic('play', 12)}</span>`;

  $('palIn').oninput = () => { idx = 0; draw(); };

    else if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') go(idx); else if (e.key === 'Escape') closeLayer();

  draw(); $('palIn').focus();
}

// RAML to OAS through the outline. In the app this is AMF's Compatibility pipeline (ARCHITECTURE 4.1).
function ramlToOas(v2) {
  const L = lines(MAIN), top = k => (L.find(l => l.startsWith(k + ':')) || '').slice(k.length + 1).trim();
  const ref = n => (v2 ? '#/definitions/' : '#/components/schemas/') + n;
  const schemaOf = t => {
    const arr = t.endsWith('[]'), name = t.replace('[]', '').split('.').pop();
    const prim = { string: { type: 'string' }, number: { type: 'number' }, integer: { type: 'integer' }, boolean: { type: 'boolean' }, datetime: { type: 'string', format: 'date-time' }, 'date-only': { type: 'string', format: 'date' } }[name];
    const one = prim || { $ref: ref(name) };
    return arr ? { type: 'array', items: one } : one;
  };
  const schemas = {};
  MODEL.types.forEach(t => {
    if (t.enumVals) schemas[t.name] = { type: 'string', enum: t.enumVals.replace(/[\[\]]/g, '').split(',').map(s => s.trim()) };
    else { const props = {}; t.props.forEach(p => props[p.name] = schemaOf(p.type)); const req = t.props.filter(p => !p.opt).map(p => p.name);
      schemas[t.name] = { type: 'object', properties: props, ...(req.length ? { required: req } : {}) }; }
  });
  const E = entries(MAIN), paths = {};
  MODEL.all.filter(n => n.kind === 'method').forEach(n => {
    const op = { summary: n.name || undefined, parameters: [] };
    keyPath(MAIN, n.line).filter(e => e.key.startsWith('/')).forEach(e => { const k = E.findIndex(x => x.i === e.i); const u = kid(E, k, 'uriParameters');
      if (u != null) kids(E, u).forEach(j => op.parameters.push({ name: E[j].key, in: 'path', required: true, ...(v2 ? { type: 'string' } : { schema: { type: 'string' } }) })); });
    const qp = kid(E, n.k, 'queryParameters');
    if (qp != null) kids(E, qp).forEach(j => { const t = kid(E, j, 'type'); const s = schemaOf(t != null ? E[t].val : 'string'); op.parameters.push({ name: E[j].key, in: 'query', ...(v2 ? (s.$ref ? { type: 'string' } : s) : { schema: s }) }); });
    if (!op.parameters.length) delete op.parameters;
    const bodyType = bk => { const mj = bk != null ? kids(E, bk)[0] : null; const t = mj != null ? kid(E, mj, 'type') : null; return t != null ? E[t].val : null; };
    const body = bodyType(kid(E, n.k, 'body'));
    if (body) { if (v2) (op.parameters ||= []).push({ name: 'body', in: 'body', required: true, schema: schemaOf(body) }); else op.requestBody = { content: { 'application/json': { schema: schemaOf(body) } } }; }
    op.responses = {};
    const rs = kid(E, n.k, 'responses');
    if (rs != null) kids(E, rs).forEach(cj => { const t = bodyType(kid(E, cj, 'body')); const desc = { 2: 'Success', 4: 'Client error', 5: 'Server error' }[E[cj].key[0]] || 'Response';
      op.responses[E[cj].key] = t ? (v2 ? { description: desc, schema: schemaOf(t) } : { description: desc, content: { 'application/json': { schema: schemaOf(t) } } }) : { description: desc }; });
    (paths[n.path] ||= {})[n.m] = JSON.parse(JSON.stringify(op));
  });
  const info = { title: top('title'), version: top('version') };
  return v2 ? { swagger: '2.0', info, host: 'api.example.com', basePath: '/orders/' + info.version, schemes: ['https'], consumes: ['application/json'], produces: ['application/json'], paths, definitions: schemas }
    : { openapi: '3.0.0', info, servers: [{ url: top('baseUri').replace('{version}', info.version) }], paths, components: { schemas } };
}
function toYaml(v, ind = 0) {
  const pad = ' '.repeat(ind);
  const scalar = s => typeof s !== 'string' ? String(s) : (/^[\w./{}$#-][^:#]*$/.test(s) && !/^(true|false|null|\d+(\.\d+)?)$/.test(s) && !/^[#{]/.test(s) ? s : `'${s.replace(/'/g, "''")}'`);
  const key = k => /^\d+$/.test(k) ? `'${k}'` : (/^[\w./{}$-]+$/.test(k) && !k.startsWith('{') ? k : `'${k}'`);
  if (Array.isArray(v)) return v.map(x => typeof x === 'object' ? `${pad}- ${toYaml(x, ind + 2).trimStart()}` : `${pad}- ${scalar(x)}`).join('\n');
  return Object.entries(v).map(([k, x]) => typeof x === 'object' && x !== null
    ? (Array.isArray(x) && x.every(y => typeof y !== 'object') ? `${pad}${key(k)}: [ ${x.map(scalar).join(', ')} ]` : `${pad}${key(k)}:\n${toYaml(x, ind + 2)}`)
    : `${pad}${key(k)}: ${scalar(x)}`).join('\n');
}
function openDuplicateFile(p) {
  const canConvert = p === MAIN;
  const stem = base(p).replace(/\.[^.]+$/, ''), dir = p.slice(0, p.length - base(p).length), ext = (base(p).match(/\.[^.]+$/) || [''])[0];
  const FORMATS = canConvert ? [['raml', 'RAML 1.0', '.raml'], ['oas3y', 'OAS 3.0 (YAML)', '.yaml'], ['oas3j', 'OAS 3.0 (JSON)', '.json'], ['oas2y', 'OAS 2.0 (YAML)', '.yaml'], ['oas2j', 'OAS 2.0 (JSON)', '.json']] : [['copy', 'Same format', ext]];
  const D = { fmt: FORMATS[0][0], name: stem + '-copy', touched: false };
  $('layer').innerHTML = `<div class="modal-scrim" id="fdScrim"><div class="modal" style="width:min(480px, 100%)" role="dialog" aria-label="Duplicate As">
    <div class="modal-head"><div style="flex:1"><h3>Duplicate As</h3><div class="sub">Makes a new file from <span class="mono" style="color:var(--content)">${esc(base(p))}</span>${canConvert ? ', in the same format or converted' : ''}.</div></div><button class="mini-btn" data-close>${ic('x', 14)}</button></div>
    <div style="padding:16px" id="fdBody"></div>
    <div class="modal-foot"><span class="note" style="margin:0;flex:1"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="fdGo">Duplicate</button></div></div></div>`;
  const draw = () => {
    const f = FORMATS.find(x => x[0] === D.fmt); const target = dir + D.name.trim() + f[2];
    const clash = !D.name.trim() || allPaths().includes(target);
    $('fdBody').innerHTML = (canConvert ? `<div class="field"><span class="lab">Format</span>${FORMATS.map(([id, label]) => `<label class="check" style="height:26px"><input type="radio" name="fdf" value="${id}" ${D.fmt === id ? 'checked' : ''}>${label}${id === 'raml' ? '<span style="color:var(--content-faint);font-size:11.5px;margin-left:2px">(exact copy)</span>' : ''}</label>`).join('')}</div>` : '')
      + `<div class="field" style="margin:0"><label for="fdName">File name</label><div style="display:flex;align-items:center;gap:6px"><input class="inp mono${clash ? ' bad' : ''}" id="fdName" value="${esc(D.name)}" spellcheck="false"><span class="mono" style="color:var(--content-faint)">${f[2]}</span></div>
        <div class="hint${clash ? ' err' : ''}">${clash ? (D.name.trim() ? `${esc(base(target))} already exists.` : 'Give it a name.') : `Saved as ${esc(target)}`}</div></div>`
      + (D.fmt !== 'raml' && D.fmt !== 'copy' ? `<div class="note" style="display:flex;gap:6px;margin-top:12px">${ic('alert', 13)}<span>Converted by AMF, the same engine Design Center uses. Check the result: a converted spec isn't always valid.</span></div>` : '');
    $('fdGo').disabled = clash;
    const inp = $('fdName'); inp.oninput = () => { D.name = inp.value; D.touched = true; const pos = inp.selectionStart; draw(); $('fdName').focus(); $('fdName').setSelectionRange(pos, pos); };
    $('fdBody').querySelectorAll('[name=fdf]').forEach(r => r.onchange = () => { D.fmt = r.value; if (!D.touched) D.name = D.fmt === 'raml' ? stem + '-copy' : stem + (D.fmt.startsWith('oas2') ? '-oas2' : ''); draw(); });
  };
  const go = () => {
    const f = FORMATS.find(x => x[0] === D.fmt); const target = dir + D.name.trim() + f[2];
    if (!D.name.trim() || allPaths().includes(target)) return;
    const text = D.fmt === 'raml' || D.fmt === 'copy' ? fileText(p)
      : D.fmt.endsWith('j') ? JSON.stringify(ramlToOas(D.fmt.startsWith('oas2')), null, 2) : toYaml(ramlToOas(D.fmt.startsWith('oas2'))) + '\n';
    S.undo = { files: JSON.parse(JSON.stringify(FILES)), dirty: [...S.dirty], tabs: [...S.tabs] };
    FILES[target] = text; S.dirty.add(target); closeLayer();
    openAt(target, 0, 0); reparse();
    toast(`Created ${base(target)}${D.fmt === 'raml' || D.fmt === 'copy' ? '' : ' as ' + f[1]}`, 'copy', { label: 'Undo', run: undoLast });
  };
  $('fdScrim').onclick = e => { if (e.target.id === 'fdScrim' || e.target.closest('[data-close]')) closeLayer(); };
  $('fdScrim').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
  $('fdGo').onclick = go;
  draw(); const el = $('fdName'); el.focus(); el.select();
}

function undoLast() {
  const u = S.undo; if (!u) return;
  Object.keys(FILES).forEach(k => delete FILES[k]); Object.assign(FILES, u.files);
  S.dirty = new Set(u.dirty); S.tabs = u.tabs; if (!S.tabs.includes(S.active)) S.active = MAIN;
  S.undo = null; S.cursor.line = Math.min(S.cursor.line, lines(S.active).length - 1); S.cursor.col = 0;
  buildModel(); syncSelFromCursor(); reparse(); toast('Undone. Every file is back as it was.', 'refresh');
}

  popAtPoint(e.clientX, e.clientY, nodeMenu(r.dataset.id)).onclick = ev => { const b = ev.target.closest('[data-act]'); if (b && !b.disabled) doAct(b.dataset.act, b.dataset.id); };
  paintIcons($('pop'));
});
$('tabs').addEventListener('click', e => {
  const c = e.target.closest('[data-close]'); if (c) { e.stopPropagation(); const p = c.dataset.close; const i = S.tabs.indexOf(p); S.tabs.splice(i, 1);
    if (!S.tabs.length) S.tabs.push(MAIN); if (S.active === p) openAt(S.tabs[Math.max(0, i - 1)]); else renderTabs(); return; }
  const t = e.target.closest('[data-tab]'); if (t && t.dataset.tab !== S.active) openAt(t.dataset.tab);
});
$('tabs').addEventListener('auxclick', e => { const t = e.target.closest('[data-tab]'); if (t && e.button === 1) t.querySelector('[data-close]').click(); });
$('crumbs').addEventListener('click', e => { const c = e.target.closest('[data-crumb]'); if (c) { S.cursor = { line: +c.dataset.crumb, col: lines(S.active)[+c.dataset.crumb].match(/^\s*/)[0].length }; syncSelFromCursor(); renderAll(); scrollToLine(S.cursor.line, true); } });
let chW = 7.5;
$('code').addEventListener('mousedown', e => {
  const ac = e.target.closest('[data-ac]'); if (ac) { e.preventDefault(); acceptCompletion(+ac.dataset.ac); return; }
  if (e.target.closest('.ac')) { e.preventDefault(); return; }
  const ln = e.target.closest('[data-line]'); if (!ln) return;
  const line = +ln.dataset.line; const txt = ln.querySelector('.txt'); const L = lines(S.active)[line];
  if ((e.ctrlKey || e.metaKey) && e.target.classList.contains('t-path')) { e.preventDefault(); const p = e.target.textContent.trim().replace(/^\//, ''); allPaths().includes(p) ? openAt(p, 0, 0) : toast('That file doesn\'t exist yet', 'alert'); return; }
  if ((e.ctrlKey || e.metaKey) && e.target.classList.contains('t-type')) { e.preventDefault(); const v = (e.target.previousSibling?.textContent || '') + e.target.textContent; const t = MODEL.types.find(t => t.q === v.replace('[]', '') || (t.name === v.replace('[]', '') && t.file === S.active)); if (t) select(t, true); return; }
  const col = Math.max(0, Math.min(L.length, Math.round((e.clientX - txt.getBoundingClientRect().left - 4) / chW)));
  S.cursor = { line, col }; S.popup = null; syncSelFromCursor();
  renderEditor(); renderCrumbs(); renderTree(); renderShelf(); renderRightPanel(); renderStatus();
});
$('pList').addEventListener('click', e => {
  const f = e.target.closest('[data-fix]'); if (f) { e.stopPropagation(); const p = PROBLEMS.find(x => x.id === f.dataset.fix); p.fix.run(); S.fixed.add(p.id); reparse(); return; }
  const r = e.target.closest('[data-prob]'); if (r) { const p = liveProblems().find(x => x.id === r.dataset.prob); openAt(p.file, p.line, p.col); }
});
$('inspBody').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (a) { doAct(a.dataset.act, a.dataset.id); return; }
  const g = e.target.closest('[data-goto]'); if (g) { const n = byId(g.dataset.goto); if (n) select(n, true); return; }
  const j = e.target.closest('[data-jump]'); if (j) { select(byId(j.dataset.jump), true); return; }
  const o = e.target.closest('[data-open]'); if (o) { allPaths().includes(o.dataset.open) ? openAt(o.dataset.open, 0, 0) : toast('That file doesn\'t exist yet. The problem list offers to create it.', 'alert'); return; }
  const ol = e.target.closest('[data-openline]'); if (ol) { const [f, l] = ol.dataset.openline.split('|'); openAt(f, +l, lines(f)[+l].search(/\S/), { keepSel: true }); }
});
document.querySelectorAll('.rail-btn[data-rail]').forEach(b => b.onclick = () => {
  const r = b.dataset.rail;
  if (S.rail === r && S.side) S.side = false; else { S.rail = r; S.side = true; }
  renderLayout(); renderTree();
});
$('collapseAll').onclick = () => { MODEL.all.filter(n => n.kind === 'res').forEach(n => S.collapsed.add(n.id)); renderTree(); };
$('filter').oninput = e => { S.filter = e.target.value; renderTree(); };
$('filter').onfocus = () => $('filterKbd').classList.add('hidden'); $('filter').onblur = () => $('filterKbd').classList.toggle('hidden', !!S.filter);
$('palBtn').onclick = openPalette;
$('homeBtn').onclick = () => { location.href = 'start-screen.html'; };
$('saveState').onclick = e => { if (e.target.closest('#pushBtn')) { const n = S.toPush; S.toPush = 0; renderHeader(); toast(`Pushed ${n} ${n === 1 ? 'change' : 'changes'} to Design Center. The lock was taken and released.`, 'cloud'); } };
$('branchBtn').onclick = openBranches;
$('shareBtn').onclick = () => toast('Opens Share project for this project in Design Center, in your browser', 'share');
$('publishBtn').onclick = openPublish;
$('projSettingsBtn').onclick = openProjectSettings;
$('appSettingsBtn').onclick = () => openSettings();
$('newFileBtn').onclick = () => toast('New file: pick the format (RAML 1.0, OAS 3.0, JSON Schema and more) and the fragment type', 'plus');
document.querySelectorAll('.rail-btn[data-rrail]').forEach(b => b.onclick = () => {
  const r = b.dataset.rrail; if (S.insp && S.rpanel === r) S.insp = false; else { S.rpanel = r; S.insp = true; }
  renderLayout(); renderRightPanel();
});
$('shelf').addEventListener('mousedown', e => {
  if (e.target.closest('#shelfTgl')) { S.shelf = !S.shelf; renderLayout(); return; }
  const it = e.target.closest('[data-shelf]'); if (it) { e.preventDefault(); shelfInsert(it.dataset.shelf); }
});
$('problems').addEventListener('click', e => {
  if (e.target.closest('#pTgl') || e.target.closest('#pOpen')) { S.problems = !S.problems; renderLayout(); return; }
  const t = e.target.closest('[data-ptab]'); if (t) { S.ptab = t.dataset.ptab; renderProblems(); return; }
  const sv = e.target.closest('[data-sevtog]'); if (sv) { S.sevOn[sv.dataset.sevtog] = !S.sevOn[sv.dataset.sevtog]; renderProblems(); }
});
$('pList').addEventListener('click', e => {
  const c = e.target.closest('[data-copyprob]'); if (!c) return; e.stopImmediatePropagation();
  const p = liveProblems().find(x => x.id === c.dataset.copyprob); try { navigator.clipboard.writeText(`${p.file}:${p.line + 1}:${p.col + 1} ${p.msg}`); } catch {} toast('Copied the message', 'copy');
}, true);
$('tree').addEventListener('click', e => {
  const ad = e.target.closest('[data-adddep]'); if (ad) { e.stopPropagation(); openAddDependency(ad.dataset.adddep); return; }
  const g = e.target.closest('[data-dgrp]'); if (g) { const id = 'dg:' + g.dataset.dgrp; S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); renderTree(); return; }
  const up = e.target.closest('[data-depupd]'); if (up) { const d = DEPS.fragments[+up.dataset.depupd]; const old = d.version; d.version = d.latest; renderTree(); reparse(); toast(`${d.name} updated from ${old} to ${d.version}. The spec is checked against it now.`); return; }
  const dm = e.target.closest('[data-depmenu]'); if (dm) { const [k, i] = dm.dataset.depmenu.split(':'); const d = DEPS[k][+i];
    popAt(dm, `<button class="mi" data-dm="files"><span class="ico">${ic('files', 14)}</span>Show in Files</button><button class="mi" data-dm="ex"><span class="ico">${ic('link', 14)}</span>Open in Exchange</button><button class="mi" data-dm="ver"><span class="ico"></span>Change version…</button><div class="msep"></div><button class="mi" data-dm="rm"><span class="ico"></span>Remove</button>`).onclick = ev => {
      const b = ev.target.closest('[data-dm]'); if (!b) return; closeLayer();
      if (b.dataset.dm === 'files') { S.rail = 'files'; S.openDirs.add('exchange_modules'); renderLayout(); renderTree(); }
      else if (b.dataset.dm === 'rm') { DEPS[k].splice(+i, 1); renderTree(); toast(`Removed ${d.name}. Its files leave exchange_modules.`, 'x'); }
      else toast(b.dataset.dm === 'ex' ? 'Opens the asset in Exchange, in your browser' : 'Lists the published versions to pick from', 'link'); }; return; }
  if (e.target.closest('[data-openex]')) toast('Opens the asset in Exchange, in your browser', 'link');
});
$('inspBody').addEventListener('click', e => {
  const d = e.target.closest('[data-docpage]'); if (d) { S.docPage = d.dataset.docpage || null; renderRightPanel(); return; }
  if (e.target.closest('[data-tryit]')) toast('Try it calls the local mock. It arrives with the docs preview (M5).', 'play');
});
document.addEventListener('mousedown', e => { if ($('pop') && !e.target.closest('#pop') && !e.target.closest('[data-menu]')) closeLayer(); });
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (document.querySelector('.modal-scrim')) { if (e.key === 'Escape') closeLayer(); return; }
  if (S.popup && document.activeElement === document.body) {
    if (e.key === 'ArrowDown') { S.popup.idx = Math.min(S.popup.idx + 1, Math.min(8, S.popup.items.length - 1)); renderEditor(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { S.popup.idx = Math.max(S.popup.idx - 1, 0); renderEditor(); e.preventDefault(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { acceptCompletion(S.popup.idx); e.preventDefault(); return; }
    if (e.key === 'Escape') { S.popup = null; renderEditor(); return; }
  }
  if (e.key === 'Escape') { closeLayer(); return; }
  if (mod && k === 'k') { e.preventDefault(); openPalette(); }
  else if (mod && k === ' ') { e.preventDefault(); S.popup = completionsAt(S.active, S.cursor.line); if (!S.popup) toast('Suggestions show after type:, is: [ and !include. Try a type: line.', 'search'); renderEditor(); }
  else if (mod && k === 's') { e.preventDefault(); saveAll(); }
  else if (mod && e.altKey && k === 'b') { e.preventDefault(); S.insp = !S.insp; renderLayout(); renderRightPanel(); }
  else if (mod && k === 'b') { e.preventDefault(); S.side = !S.side; renderLayout(); }
  else if (mod && k === 'j') { e.preventDefault(); S.problems = !S.problems; renderLayout(); }
  else if (mod && k === ',') { e.preventDefault(); openSettingsScreen(); }
  else if (mod && k === 'z' && S.undo && document.activeElement === document.body) { e.preventDefault(); undoLast(); }
  else if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); S.side = true; renderLayout(); $('filter').focus(); }
});

// splitters
function splitter(el, v, axis, sign, min, max) {
  el.onpointerdown = e => { const root = document.documentElement; const start = axis === 'x' ? e.clientX : e.clientY; const sv = parseFloat(getComputedStyle(root).getPropertyValue(v));
    el.setPointerCapture(e.pointerId); document.body.style.cursor = axis === 'x' ? 'col-resize' : 'row-resize';
    el.onpointermove = ev => root.style.setProperty(v, Math.max(min, Math.min(max, sv + sign * ((axis === 'x' ? ev.clientX : ev.clientY) - start))) + 'px');
    el.onpointerup = () => { el.onpointermove = null; document.body.style.cursor = ''; }; };
}
splitter($('splitL'), '--left-w', 'x', 1, 200, 480);
splitter($('splitR'), '--right-w', 'x', -1, 260, 560);
splitter($('splitB'), '--bottom-h', 'y', -1, 80, 480);

setInterval(() => { if (S.engine === 'ready') { S.checkedAgo++; if (S.problems) renderProblems(); } }, 1000);

// ---------- Boot: cursor on the unfinished type: line, with suggestions open ----------
paintIcons(); applyTheme(); buildModel();
{ const L = lines(MAIN); const line = L.findIndex(l => l.trimEnd().endsWith('ordersLib.Ord')); S.cursor = { line, col: L[line].length }; S.popup = completionsAt(MAIN, line); syncSelFromCursor(); }
renderAll(false);
requestAnimationFrame(() => {
  const probe = document.createElement('span'); probe.className = 'mono'; probe.style.cssText = 'position:absolute;visibility:hidden;font-size:12.5px'; probe.textContent = 'x'.repeat(100);
  $('code').appendChild(probe); chW = probe.getBoundingClientRect().width / 100; probe.remove();
  scrollToLine(S.cursor.line, false); $('editor').scrollTop += 120;
});
</script>
