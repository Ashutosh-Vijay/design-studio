[package]
name = "api-designer-studio"
version = "0.1.0"
description = "A fast desktop designer for Anypoint Design Center specs"
authors = ["Ashutosh Vijay"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Delete sends files to the Recycle Bin / Trash, so a mistake can be undone.
trash = "5"
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# M3: Anypoint over HTTPS, tokens and Connected App secrets in the system keychain.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# The broker sign-in proves who started it with a hashed verifier (SHA-256, base64url).
sha2 = "0.10"
base64 = "0.22"
