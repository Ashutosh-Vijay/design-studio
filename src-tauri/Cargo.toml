[package]
name = "design-studio"
version = "0.1.2"
description = "A fast desktop designer for Anypoint Design Center specs"
authors = ["Ashutosh Vijay"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Delete sends files to the Recycle Bin / Trash, so a mistake can be undone.
trash = "5"
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# M3: Anypoint over HTTPS, tokens and Connected App secrets in the system keychain.
# Certificates come from the system store, not a bundled list: a company proxy that inspects TLS has its
# certificate there, and nowhere else.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# The broker sign-in proves who started it with a hashed verifier (SHA-256, base64url).
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
# The MCP server for AI tools (Streamable HTTP on 127.0.0.1), as in DataWeave Studio.
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["time", "net", "sync", "rt", "macros"] }
tauri-plugin-single-instance = "2"
