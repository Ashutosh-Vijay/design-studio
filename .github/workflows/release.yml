name: Build & Release

# A tag like v1.0.0: check (versions and notes, then every verification), build every platform into a draft
# release, and only when all of that succeeded publish it (the Marketplace, then the release). A release that's
# already published is never touched: bump the version instead. Copied from DataWeave Studio's release.yml.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # "false" while the beta ships only as the VS Code extension: no desktop builds, a pre-release with the
  # four .vsix and VS Code-only notes. Set to "true" when the desktop app ships.
  DESKTOP: "false"
  NODE_OPTIONS: --max-old-space-size=4096
  # linuxdeploy and appimagetool are AppImages themselves; runners have no FUSE, so they self-extract.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # linuxdeploy strips every ELF it bundles and trips on the jlinked JRE, which jlink already stripped.
  NO_STRIP: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Versions, notes and changelog agree with the tag (docs/RELEASING.md), before anything else.
      - name: Check the release
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      # A draft left by a failed run is replaced; a published release is never deleted.
      - name: Clear a draft of this tag
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then echo "::error::$GITHUB_REF_NAME is already published. Bump the version and tag again."; exit 1; fi
          if [ "$state" = "true" ]; then gh release delete "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --yes; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With the desktop app, tauri-action makes the draft release; without it, it's made here.
      - name: Make the draft release (VS Code only)
        if: env.DESKTOP != 'true'
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" --vscode > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --draft --prerelease --title "Design Studio for VS Code $GITHUB_REF_NAME (BETA)" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every verification the release checklist asks for (docs/RELEASING.md), on the engine built here.
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: npm ci
      - name: Build the AMF engine
        run: cd amf-server && mvn -B -q -DskipTests package
      - name: Academy, starters and sync
        run: npm run academy:verify && npm run starters:verify && npm run sync:verify
      - name: The VS Code extension's file boundary and sign-in renewal
        run: cd vscode-extension && npm ci && npm run verify

  build:
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            jdkArch: x64
            vsixTarget: win32-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            jdkArch: aarch64
            vsixTarget: darwin-arm64
          # Intel Macs: an x64 JDK through Rosetta on the Apple Silicon runner, so the JRE is x64.
          - platform: macos-latest
            target: x86_64-apple-darwin
            jdkArch: x64
            vsixTarget: darwin-x64
          # The oldest supported Ubuntu on purpose: the AppImage needs the build machine's glibc or newer.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            jdkArch: x64
            vsixTarget: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        if: env.DESKTOP == 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        if: env.DESKTOP == 'true'
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up JDK 17 (for the AMF engine and its JRE)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          architecture: ${{ matrix.jdkArch }}
          cache: maven

      - name: Install Linux build deps
        if: runner.os == 'Linux' && env.DESKTOP == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Build the AMF engine (amf-server.jar)
        shell: bash
        run: |
          cd amf-server
          mvn -B -q -DskipTests package
          mkdir -p ../src-tauri/resources/amf-server
          cp target/amf-server.jar ../src-tauri/resources/amf-server/

      - name: Bundle a minimal JRE (jlink)
        shell: bash
        run: |
          MODULES=$(jdeps --print-module-deps --ignore-missing-deps --multi-release 17 src-tauri/resources/amf-server/amf-server.jar 2>/dev/null || echo "java.base,java.desktop,java.management,java.naming,java.sql,jdk.unsupported")
          # jdk.httpserver for the local mock, jdk.crypto.ec for HTTPS, jdk.zipfs for zip reads.
          # jlink refuses a folder that exists, and git keeps this one (its .gitkeep): it goes first.
          rm -rf src-tauri/resources/jre
          jlink --add-modules "$MODULES,jdk.httpserver,jdk.crypto.ec,jdk.zipfs" --strip-debug --no-man-pages --no-header-files --compress=2 --output src-tauri/resources/jre
          echo "Bundled JRE: $(du -sh src-tauri/resources/jre | cut -f1)"

      - name: Bake in the sign-in clients (clients.json)
        shell: bash
        run: |
          # The public per-region Connected Apps, so a fresh install signs in even if GitHub is unreachable
          # at first start. The repo only keeps an empty copy.
          curl -fsSL https://raw.githubusercontent.com/Ashutosh-Vijay/design-studio-auth/main/clients.json -o src-tauri/clients.json
          node -e "const c=require('./src-tauri/clients.json'); if(!c.regions) process.exit(1); console.log('regions:', Object.keys(c.regions).join(', '))"

      # Versions, notes and changelog agree with the tag (docs/RELEASING.md), and the release text comes from src/releases.json.
      - name: Check the release, write its notes
        id: notes
        shell: bash
        run: |
          node scripts/release-check.mjs "$GITHUB_REF_NAME"
          { echo 'body<<NOTES_END'; node scripts/release-notes.mjs "$GITHUB_REF_NAME"; echo 'NOTES_END'; } >> "$GITHUB_OUTPUT"

      - name: Build the app
        if: env.DESKTOP == 'true'
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy looks for libjvm.so only in standard paths; point it at the JRE's own.
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && format('{0}/src-tauri/resources/jre/lib:{0}/src-tauri/resources/jre/lib/server', github.workspace) || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Design Studio ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} ${{ runner.os == 'Linux' && '--verbose' || '' }}

      - name: Zip the Windows installer (for proxies that block .exe)
        if: matrix.platform == 'windows-latest' && env.DESKTOP == 'true'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exe = Get-ChildItem -Recurse -Filter "*_x64-setup.exe" src-tauri/target | Select-Object -First 1
          if ($exe) {
            $zip = Join-Path $exe.DirectoryName "Design.Studio_${version}_x64-setup.zip"
            Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
            gh release upload "${{ github.ref_name }}" $zip --repo "${{ github.repository }}" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Portable: the installer's payload extracted with 7-Zip (no install, no admin), zipped.
      - name: Build the portable Windows zip
        if: matrix.platform == 'windows-latest' && env.DESKTOP == 'true'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exe = Get-ChildItem -Recurse -Filter "*_x64-setup.exe" src-tauri/target | Select-Object -First 1
          if (-not $exe) { Write-Host "No installer found; skipping"; exit 0 }
          $dest = "C:\dsportable"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & 7z x "$($exe.FullName)" "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "7z couldn't extract $($exe.Name)"; exit 1 }
          Remove-Item -Recurse -Force "$dest\`$PLUGINSDIR" -ErrorAction SilentlyContinue
          Remove-Item -Force "$dest\uninstall.exe" -ErrorAction SilentlyContinue
          # 7-Zip keeps the cargo binary name; the installer would have renamed it to the product name.
          if ((Test-Path "$dest\design-studio.exe") -and -not (Test-Path "$dest\Design Studio.exe")) { Rename-Item "$dest\design-studio.exe" "Design Studio.exe" }
          $appExe = Get-ChildItem -Recurse -Filter "Design Studio.exe" $dest -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appExe) { Get-ChildItem -Recurse $dest | Select-Object -ExpandProperty FullName; Write-Error "The app's exe wasn't found"; exit 1 }
          $zip = "Design.Studio_${version}_x64_portable.zip"
          Compress-Archive -Path "$($appExe.Directory.FullName)\*" -DestinationPath $zip -Force
          gh release upload "${{ github.ref_name }}" $zip --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The VS Code extension, one per platform (it carries this platform's JRE, as the desktop app does).
      - name: Build the VS Code extension (.vsix)
        shell: bash
        run: |
          npm run build:vscode
          cd vscode-extension
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          node scripts/bundle-resources.mjs
          cp ../LICENSE ../NOTICE .
          npx --yes @vscode/vsce@3 package --target ${{ matrix.vsixTarget }} --no-dependencies --allow-missing-repository -o "design-studio-${GITHUB_REF_NAME#v}-${{ matrix.vsixTarget }}.vsix"
          gh release upload "$GITHUB_REF_NAME" *.vsix --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only after every platform built: the four .vsix to the Marketplace together, then the release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the extension to the Marketplace
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice::VSCE_PAT isn't set, so the .vsix wasn't published to the Marketplace."; exit 0; fi
          gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --pattern '*.vsix'
          [ "$(ls *.vsix | wc -l)" = "4" ] || { echo "::error::Expected four .vsix on the release."; exit 1; }
          # --skip-duplicate makes a rerun publish only the platforms that are missing.
          for f in *.vsix; do npx --yes @vscode/vsce@3 publish --packagePath "$f" --skip-duplicate --pat "$VSCE_PAT"; done
          # The Marketplace once said "Published" for all four on 0.1.0 and kept only one: check it lists every platform.
          for i in $(seq 1 30); do
            got=$(curl -s -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=7.2-preview.1' \
              -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"ashutosh-vijay.design-studio-mulesoft\"}]}],\"flags\":17}" \
              | jq -r --arg v "${GITHUB_REF_NAME#v}" '[.results[0].extensions[0].versions[] | select(.version == $v) | .targetPlatform] | sort | join(",")')
            [ "$got" = "darwin-arm64,darwin-x64,linux-x64,win32-x64" ] && { echo "The Marketplace lists all four platforms."; exit 0; }
            echo "The Marketplace lists: ${got:-nothing yet}"; sleep 60
          done
          echo "::error::The Marketplace doesn't list all four platforms after 30 minutes. Rerun this job to publish the missing ones."; exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish the release
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
